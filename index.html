<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Topdown Roguelite MVP</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b14; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: env(safe-area-inset-top) 0 auto 0; padding: 12px; pointer-events: none; text-shadow: 0 2px 4px #000; font-weight: 700; }
    #topline { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    #healthWrap { margin-top: 8px; width: min(360px, 72vw); height: 14px; border: 2px solid rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.45); }
    #health { height: 100%; width: 100%; background: linear-gradient(90deg, #f23c55, #ff824f); transition: width .12s linear; }
    #hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 58px); transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,.75); pointer-events: none; white-space: nowrap; }
    #dash { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); width: 86px; height: 86px; border-radius: 50%; border: 3px solid rgba(255,255,255,.8); background: rgba(63,106,255,.38); color: white; font-weight: 900; font-size: 15px; touch-action: none; user-select: none; }
    #dash:active { transform: scale(.94); }
    #dash[disabled] { opacity: .42; }
    #joystickBase { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); width: 130px; height: 130px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); background: rgba(255,255,255,.07); pointer-events: none; }
    #joystickKnob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 4px 20px rgba(0,0,0,.45); }
    #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(3,5,10,.8); padding: 24px; }
    #panel { width: min(420px, 92vw); padding: 26px; text-align: center; border: 1px solid rgba(255,255,255,.18); border-radius: 20px; background: rgba(16,22,40,.96); box-shadow: 0 20px 70px rgba(0,0,0,.5); }
    #panel h1 { margin: 0 0 10px; font-size: 30px; }
    #panel p { margin: 8px 0 20px; color: rgba(255,255,255,.76); line-height: 1.55; }
    #restart { width: 100%; padding: 15px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 900; background: white; color: #111827; }
    @media (min-width: 900px) {
      #joystickBase, #dash { opacity: .7; }
      #hint::after { content: " · PC: WASD / 방향키, Space 대시"; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Topdown Roguelite 게임 화면"></canvas>
  <div id="hud">
    <div id="topline"><span id="stats">LV 1 · 0 KILLS</span><span id="timer">00:00</span></div>
    <div id="healthWrap"><div id="health"></div></div>
  </div>
  <div id="hint">왼쪽 조이스틱 이동 · 적 자동 조준/사격 · 오른쪽 대시</div>
  <div id="joystickBase"><div id="joystickKnob"></div></div>
  <button id="dash" type="button">DASH</button>
  <div id="overlay">
    <div id="panel">
      <h1>GAME OVER</h1>
      <p id="result"></p>
      <button id="restart" type="button">다시 시작</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
