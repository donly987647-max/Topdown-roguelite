name: One-shot Playtest Documentation Sync

on:
  push:
    branches: [fix/first-playtest-blockers-2026-08-02]
    paths:
      - '.github/playtest-doc-trigger.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical project documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('PROJECT.md')
          text = p.read_text(encoding='utf-8')
          replacements = [
            ('**Current build is NOT GDD-complete and is NOT marked runtime-validated until the observed Godot 4.7.1 CI run succeeds.**',
             '**Current build is NOT GDD-complete. Main previously passed Godot 4.7.1 validation run #154, but the first hands-on user playtest exposed blocking display/UI/collision/ammo defects. Those findings are tracked in `docs/playtests/2026-08-02-first-launch-blockers.md` and must pass the new regression gate before this playtest-fix batch is promoted.**'),
            ('- Face buttons cover dash/reload/interact/character active; Back toggles map; D-pad and accept/cancel drive Control focus navigation.',
             '- Face buttons cover dash/reload/interact/character active; D-pad and accept/cancel drive Control focus navigation. The full route graph is no longer available as an in-combat overlay; it appears only for post-combat route selection. A dedicated combat minimap remains separate future UI work.'),
            ('- Key/curse/status layers are placeholders until those systems exist; therefore HUD remains PARTIAL rather than production-complete.',
             '- Key/curse/status layers are placeholders until those systems exist; therefore HUD remains PARTIAL rather than production-complete.\n- User playtest decision: player weapons keep finite magazines/reload timing but use infinite reserve ammo (`∞`) so total ammo depletion cannot soft-lock a run.'),
            ('- `AuthoredRoomShellBuilder` uses World collision layer 2 and creates explicit boundaries/obstacles/hazards/spawns/entrances/exits from authored template cells.',
             '- `AuthoredRoomShellBuilder` uses World collision layer 2 and creates explicit boundaries/obstacles/hazards/spawns/entrances/exits from authored template cells.\n- First hands-on playtest collision audit fixed Zone 1 melee/ranged bodies to EnemyBody layer 5, melee attack areas to EnemyAttack→PlayerHurtbox, and enemy projectile scenes to EnemyProjectile→Player/World/Hurtbox.'),
            ('- `.github/workflows/godot-4-7-validation.yml` installs canonical Godot 4.7.1, imports/parses the project headlessly, then runs the smoke suite.',
             '- `.github/workflows/godot-4-7-validation.yml` installs canonical Godot 4.7.1, imports/parses every GDScript, boots the default scene headlessly, runs `first_playtest_regression_smoke.gd`, then runs the existing runtime/P2 smoke suite.'),
            ('- To obtain an observable pull-request-triggered run, validation branch `validation/godot-p2-batch` and **PR #8** were opened.\n- Observed Actions run: **Godot 4.7.1 Validation #91 / run id 30729733320**. At the time of this document update it is still queued; therefore none of the above systems are promoted to VALIDATED yet.',
             '- Observed baseline after parser repairs: **Godot 4.7.1 Validation run #154** passed exhaustive parsing of all 86 GDScript files, default main-scene boot, GDD runtime, run-system, lifecycle, room-scene, P2 integration, and frontend/GR-01 smoke suites.\n- First hands-on user playtest then found defects not covered by those tests. `first_playtest_regression_smoke.gd` is now a mandatory regression gate for fullscreen presentation, route-map visibility, collision-layer contracts, and infinite starter reserve ammo.'),
            ('1. Inspect PR #8 Godot 4.7.1 run #91 as soon as it starts; repair every parser/runtime/smoke failure and re-run until green.',
             '1. Merge the first hands-on playtest blocker batch only after its Godot 4.7.1 PR validation is green, then have the user re-check fullscreen presentation, enemy hit registration, route-map timing, and reload after zero reserve.'),
            ('- 2026-08-02: No CI/code status is called VALIDATED until an observed Godot 4.7.1 workflow succeeds.',
             '- 2026-08-02: No CI/code status is called VALIDATED until an observed Godot 4.7.1 workflow succeeds.\n- 2026-08-02: First hands-on playtest: desktop starts fullscreen with expand stretch; the full route graph is post-combat only; dedicated combat minimap is a separate UI feature.\n- 2026-08-02: Player weapons use finite magazines but infinite reserve ammo to prevent ammo-depletion soft-locks; GDD shop/ammo economy must be reconciled later.\n- 2026-08-02: Physics layer contracts are release-blocking and covered by regression tests after normal enemies were found on the wrong default collision layer.'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit('PROJECT replacement target missing: ' + old[:100])
            text = text.replace(old, new, 1)
          text += '\n\n### 2026-08-02 — First hands-on playtest blocker batch\n- Logged user findings in `docs/playtests/2026-08-02-first-launch-blockers.md`.\n- Switched desktop startup from forced 1280×720 window to fullscreen + expand stretch.\n- Restricted full route graph to post-combat route selection; removed in-combat full-map toggle behavior.\n- Corrected Zone 1 enemy/player projectile collision-layer contracts and related enemy attack/projectile layers.\n- Made starter/player weapon reserve ammo infinite while preserving magazine/reload mechanics.\n- Added `first_playtest_regression_smoke.gd` and made it part of Godot 4.7.1 CI.\n'
          p.write_text(text, encoding='utf-8')

          g = Path('docs/GDD_COVERAGE.md')
          text = g.read_text(encoding='utf-8')
          replacements = [
            ('| 11 | 조준과 사격 | **PARTIAL** | projectile payload, 관통/도탄/유도/치명타/폭발/연쇄/swept collision 기반. QA/피드백 미완 |',
             '| 11 | 조준과 사격 | **PARTIAL** | projectile payload + swept collision 기반. 첫 사용자 플레이에서 일반 적이 기본 물리 레이어에 남아 탄환이 관통하는 치명 결함 발견→EnemyBody 레이어 수정 및 회귀 테스트 추가. 실제 재플레이 QA 남음 |'),
            ('| 12 | 재장전 시스템 | **PARTIAL** | 예비탄/완벽 재장전/취소/상태형 탄창, Reactive 방 리셋 존재. UI/QA 미완 |',
             '| 12 | 재장전 시스템 | **PARTIAL** | 탄창/완벽 재장전/취소/상태형 탄창 유지. 사용자 결정으로 총 예비탄은 무한화하여 탄약 고갈 soft-lock 제거; 기존 GDD 탄약 경제는 추후 재정의 필요 |'),
            ('| 47 | UI 구조 | **PARTIAL** | MainMenu/CharacterSelect/RunMap/Reward/Result 실제 Control scenes. 전투 HUD/시설/설정/패드 navigation 미완 |',
             '| 47 | UI 구조 | **PARTIAL** | 전투 HUD와 full route map을 분리. 전체 경로 노드는 전투 중 숨기고 전투/보상 해결 후 경로 선택 시만 표시. GDD 47.1 전투용 미니맵은 별도 구현 필요 |'),
            ('| 49 | 지도 UI | **PARTIAL** | graph/visited/cleared/current/safe-risk route를 실제 클릭 UI로 표시. 패드/최종 아트 미완 |',
             '| 49 | 지도 UI | **PARTIAL** | graph/visited/cleared/current/safe-risk route 클릭 UI 존재. 첫 플레이 피드백 반영으로 full graph는 post-combat route selection 전용; 전투 overlay 금지. 최종 아트/미니맵 미완 |'),
            ('| 63 | 기술 구조 | **PARTIAL** | data/runtime/scene/run/save/frontend 계층 + Godot 4.7.1 CI workflow. 실제 성공 CI 미관측 |',
             '| 63 | 기술 구조 | **PARTIAL** | data/runtime/scene/run/save/frontend 계층 + Godot 4.7.1 CI. baseline run #154에서 86 GDScript 전수 parse/boot/기존 smoke 성공 관측; hands-on 회귀 gate 추가 |'),
            ('| 65 | 화면 비율과 디스플레이 | **PARTIAL** | 1920×1080 viewport/1280×720 window/canvas stretch. 비율/UI scale QA 미완 |',
             '| 65 | 화면 비율과 디스플레이 | **PARTIAL** | 첫 사용자 플레이 피드백으로 1280×720 강제 창 제거, desktop fullscreen + canvas `expand` 적용. 다양한 모니터 비율/UI scale 수동 QA 남음 |'),
            ('| 75 | QA 계획 | **PARTIAL** | 6개 headless smoke + `.github/workflows/godot-4-7-validation.yml` 추가. 현재 connector에서 성공 check 미관측, 수동 플레이 QA 미실시 |',
             '| 75 | QA 계획 | **PARTIAL** | 86 GDScript 전수 parse + main boot + 기존 smoke에 hands-on blocker regression smoke 추가. baseline run #154 성공 관측; 사용자 실제 재플레이/Windows 전체 런 QA 남음 |'),
            ('- CI workflow is present for Godot 4.7.1 import + headless smoke execution.\n- Current connector-visible combined commit statuses are empty.\n- Therefore **no current row is promoted to VALIDATED due to CI**.',
             '- Godot 4.7.1 baseline validation run #154 was observed green for exhaustive 86-script parsing, main boot and the pre-existing smoke suite.\n- First hands-on playtest exposed defects outside that prior coverage, so no gameplay row is promoted to VALIDATED solely from run #154.\n- `first_playtest_regression_smoke.gd` now covers fullscreen, route-map timing, collision-layer contracts and infinite starter reserve ammo; user re-play remains required.'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit('GDD coverage replacement target missing: ' + old[:100])
            text = text.replace(old, new, 1)
          g.write_text(text, encoding='utf-8')
          PY
      - name: Commit documentation sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/GDD_COVERAGE.md
          git commit -m "Document first hands-on playtest decisions and regressions"
          git push origin HEAD:fix/first-playtest-blockers-2026-08-02
