name: Temporary Parser Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser-unsafe inferred node types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/combat/weapon_controller.gd')
          text = path.read_text(encoding='utf-8')
          old = '''\tfor candidate in get_tree().get_nodes_in_group("enemy"):
\t\tif not (candidate is Node2D) or not candidate.has_method("take_damage"):
\t\t\tcontinue
\t\tvar offset := candidate.global_position - origin
\t\tif offset.length() > 125.0 or offset.length_squared() <= 0.01:
\t\t\tcontinue
\t\tif forward.dot(offset.normalized()) < 0.42:
\t\t\tcontinue
\t\tvar amount := damage * _perfect_reload_damage_bonus * _devour_multiplier
\t\tcandidate.take_damage(amount, forward * 620.0)
\t\thit_any = true
\tfor node in get_tree().get_nodes_in_group("enemy_projectile"):
\t\tif not (node is EnemyProjectile) or not is_instance_valid(node):
\t\t\tcontinue
\t\tif origin.distance_squared_to(node.global_position) > 135.0 * 135.0:
\t\t\tcontinue
\t\tvar reflected_direction := origin.direction_to(node.global_position)
\t\tvar reflected_damage := node.damage * 1.5
\t\tnode.queue_free()
\t\tvar payload := {"owner": _owner_actor(), "weapon_controller": self, "faction": &"player", "pierce": 0, "ricochet": 0}
\t\t_spawn_projectile(reflected_direction, payload, reflected_damage / maxf(damage, 0.01), node.global_position - muzzle.global_position)
\t\thit_any = true
'''
          new = '''\tfor candidate in get_tree().get_nodes_in_group("enemy"):
\t\tif not (candidate is Node2D) or not candidate.has_method("take_damage"):
\t\t\tcontinue
\t\tvar enemy_node: Node2D = candidate as Node2D
\t\tvar offset: Vector2 = enemy_node.global_position - origin
\t\tif offset.length() > 125.0 or offset.length_squared() <= 0.01:
\t\t\tcontinue
\t\tif forward.dot(offset.normalized()) < 0.42:
\t\t\tcontinue
\t\tvar amount: float = damage * _perfect_reload_damage_bonus * _devour_multiplier
\t\tenemy_node.call("take_damage", amount, forward * 620.0)
\t\thit_any = true
\tfor node in get_tree().get_nodes_in_group("enemy_projectile"):
\t\tif not (node is EnemyProjectile) or not is_instance_valid(node):
\t\t\tcontinue
\t\tvar enemy_projectile: EnemyProjectile = node as EnemyProjectile
\t\tif origin.distance_squared_to(enemy_projectile.global_position) > 135.0 * 135.0:
\t\t\tcontinue
\t\tvar reflected_direction: Vector2 = origin.direction_to(enemy_projectile.global_position)
\t\tvar reflected_damage: float = enemy_projectile.damage * 1.5
\t\tvar reflected_position: Vector2 = enemy_projectile.global_position
\t\tenemy_projectile.queue_free()
\t\tvar payload: Dictionary = {"owner": _owner_actor(), "weapon_controller": self, "faction": &"player", "pierce": 0, "ricochet": 0}
\t\t_spawn_projectile(reflected_direction, payload, reflected_damage / maxf(damage, 0.01), reflected_position - muzzle.global_position)
\t\thit_any = true
'''
          if old not in text:
              print('Target block already fixed or changed; nothing to do.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Patched weapon_controller.gd')
          PY
      - name: Commit parser fix if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/combat/weapon_controller.gd
          git commit -m "Fix parser-safe compression hammer node typing"
          git push origin HEAD:main
