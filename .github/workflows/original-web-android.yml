name: Original Web Android Validation

on:
  push:
    branches: [android/original-web-wrapper]
  pull_request:
    branches: [playtest-stable]
  workflow_dispatch:

concurrency:
  group: original-web-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original game files are unchanged
        run: |
          git diff --exit-code c23bdddec9f8b0dfab355faff5d4b212e6755be7 -- \
            index.html style.css responsive.css viewport-fix.js manifest.json sw.js data.js \
            game-1.js game-2-v1.js game-2-v2.js game-2-v3.js game-2-v4.js \
            game-3-1.js game-3-2.js game-3-3.js game-4-1.js game-4-2.js

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mobile smoke-test runtime
        run: npm install --no-audit --no-fund

      - name: Locate Chrome for touch simulation
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install chromium
            CHROME_PATH="$(node -e "import('playwright').then(({chromium})=>process.stdout.write(chromium.executablePath()))")"
          fi
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Test first-room mobile reward, inventory and route touch flow
        run: npm run test:original-mobile

      - name: Upload mobile smoke capture
        uses: actions/upload-artifact@v4
        with:
          name: LastMagazine-Original-Mobile-Smoke
          path: builds/original-web-smoke/
          if-no-files-found: error

      - name: Pack immutable original web assets
        run: python3 tools/prepare_original_android_assets.py --output android-wrapper/app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and emulator components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build offline original-game APK
        run: gradle -p android-wrapper --no-daemon :app:assembleDebug

      - name: Validate APK contents and permissions
        run: |
          mkdir -p builds/android
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
            builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk
          test -s builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk
          unzip -l builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk | tee builds/android/apk-files.txt
          test "$(unzip -l builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk | grep -c 'classes[0-9]*\.dex')" -eq 1
          for asset in index.html style.css responsive.css data.js game-1.js game-3-1.js game-4-2.js asset-manifest.json; do
            grep -q "assets/$asset" builds/android/apk-files.txt
          done
          "$ANDROID_HOME/build-tools/35.0.1/aapt2" dump permissions \
            builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk | tee builds/android/apk-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt2" dump badging \
            builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk | tee builds/android/apk-badging.txt
          grep -q "launchable-activity: name='com.lastmagazine.game.MainActivity'" builds/android/apk-badging.txt
          if grep -q "android.permission.INTERNET" builds/android/apk-permissions.txt; then
            echo "Offline wrapper must not request INTERNET permission"
            exit 1
          fi
          unzip -p builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk \
            assets/asset-manifest.json > builds/android/asset-manifest.json
          sha256sum builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk \
            | tee builds/android/SHA256SUMS.txt

      - name: Boot APK on Android 15 emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          echo no | avdmanager create avd \
            --force \
            --name last-magazine-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          nohup emulator \
            -avd last-magazine-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -wipe-data \
            > builds/android/emulator.log 2>&1 &

          adb wait-for-device
          BOOTED=""
          for attempt in $(seq 1 180); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOTED" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"

          adb install -r builds/android/LAST_MAGAZINE_ORIGINAL_ANDROID.apk \
            | tee builds/android/adb-install.txt
          adb logcat -c
          adb shell am start -W -n com.lastmagazine.game/.MainActivity \
            | tee builds/android/activity-start.txt
          grep -q "Status: ok" builds/android/activity-start.txt

          sleep 10
          APP_PID="$(adb shell pidof com.lastmagazine.game | tr -d '\r')"
          test -n "$APP_PID"
          echo "$APP_PID" > builds/android/app-pid.txt

          adb shell dumpsys activity activities \
            > builds/android/activity-state.txt
          grep -q "com.lastmagazine.game/.MainActivity" builds/android/activity-state.txt

          adb exec-out screencap -p > builds/android/emulator-startup.png
          test -s builds/android/emulator-startup.png
          adb logcat -d > builds/android/logcat.txt

          if grep -E "FATAL EXCEPTION|Process: com\.lastmagazine\.game|Unable to start activity.*lastmagazine" builds/android/logcat.txt; then
            echo "LAST MAGAZINE crashed during Android startup"
            exit 1
          fi

      - name: Upload original Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LastMagazine-Original-Android
          path: builds/android/
          if-no-files-found: error
