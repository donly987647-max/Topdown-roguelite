name: Foundation Check

on:
  push:
    branches: [godot-main]
  pull_request:
    branches: [godot-main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project structure
        run: python tools/validate_project.py
