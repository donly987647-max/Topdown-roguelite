name: Godot P1 Check

on:
  push:
    branches: [godot-main]
  pull_request:
    branches: [godot-main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and GDD constants
        run: python tools/validate_project.py
      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
      - name: Import project headlessly
        run: ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run P1 automated tests
        run: ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/p1_test_runner.gd
