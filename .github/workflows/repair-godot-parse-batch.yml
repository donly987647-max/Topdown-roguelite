name: One-shot Godot Parse Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/repair-godot-parse-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair parser and API compatibility issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'scripts/combat/projectile.gd': [
                  ('var maximum := receiver.get("max_health")', 'var maximum: Variant = receiver.get("max_health")'),
                  ('var value := receiver.get("health")', 'var value: Variant = receiver.get("health")'),
                  ('var projectile_damage := node.get("damage")', 'var projectile_damage: Variant = node.get("damage")'),
              ],
              'scripts/data/active_equipment_definition.gd': [
                  ('@export var effect_ids: PackedStringArray = []\n', ''),
              ],
              'scripts/enemies/ranged_enemy.gd': [
                  ('PackedVector2Array(Vector2(30, 0), Vector2(length, 0))', 'PackedVector2Array([Vector2(30, 0), Vector2(length, 0)])'),
              ],
              'scripts/run/room_template_registry.gd': [
                  ('var a_score := abs(a.recommended_threat - node.difficulty) + int(usage_counts.get(a.id, 0)) * 2', 'var a_score: int = absi(a.recommended_threat - node.difficulty) + int(usage_counts.get(a.id, 0)) * 2'),
                  ('var b_score := abs(b.recommended_threat - node.difficulty) + int(usage_counts.get(b.id, 0)) * 2', 'var b_score: int = absi(b.recommended_threat - node.difficulty) + int(usage_counts.get(b.id, 0)) * 2'),
              ],
              'scripts/run/run_graph.gd': [
                  ('func connect(from_id: StringName, to_id: StringName) -> bool:', 'func connect_nodes(from_id: StringName, to_id: StringName) -> bool:'),
                  ('var current := queue.pop_front()', 'var current: StringName = StringName(queue.pop_front())'),
              ],
              'scripts/status/status_controller.gd': [
                  ('var amount := definition.damage_per_tick * int(state["stacks"]) * float(state["source_power"])', 'var amount: float = definition.damage_per_tick * int(state["stacks"]) * float(state["source_power"])'),
              ],
              'scripts/ui/run_map_view_model.gd': [
                  ('var current := queue.pop_front()', 'var current: StringName = StringName(queue.pop_front())'),
              ],
          }

          changed = []
          for rel, pairs in replacements.items():
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected pattern in {rel}: {old}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(rel)

          # RunGraph previously used Object.connect's reserved/native method name.
          # Update every explicit `graph.connect(...)` RunGraph call site.
          for root in (Path('scripts'), Path('tools')):
              for path in root.rglob('*.gd'):
                  text = path.read_text(encoding='utf-8')
                  new_text = text.replace('graph.connect(', 'graph.connect_nodes(')
                  if new_text != text:
                      path.write_text(new_text, encoding='utf-8')
                      changed.append(str(path))

          print('Changed files:')
          for rel in sorted(set(changed)):
              print(' -', rel)
          PY
      - name: Commit repairs
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No repairs needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tools
          git commit -m "Repair Godot 4.7.1 parse failures across runtime"
          git push origin HEAD:main
