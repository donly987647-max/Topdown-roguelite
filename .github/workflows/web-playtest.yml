name: Web Playtest Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          curl -fL "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux*' | head -n1)"
          chmod +x "$BIN"
          sudo ln -sf "$BIN" /usr/local/bin/godot
          curl -fL "$TEMPLATE_URL" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Import and validate project
        run: timeout 90s godot --headless --editor --path . --quit-after 3

      - name: Smoke test live gameplay scene
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tools/runtime_scene_smoke.gd 2>&1 | tee runtime-scene-smoke.log

      - name: Upload runtime smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAST-MAGAZINE-Runtime-Smoke-Log
          path: runtime-scene-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke test mobile touch input
        run: timeout 90s godot --headless --path . --script res://tools/mobile_input_smoke.gd

      - name: Audit weapon assembly combinations
        run: timeout 90s godot --headless --path . --script res://tools/weapon_assembly_audit.gd

      - name: Export cache-busted web playtest with DOM controls
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p builds/web
          SHORT_SHA="${GITHUB_SHA:0:12}"
          BASE="game-${SHORT_SHA}"
          DOM_JS="mobile-controls-${SHORT_SHA}.js"
          godot --headless --path . --export-release "Web Playtest" "builds/web/${BASE}.html"
          cp "builds/web/${BASE}.html" builds/web/index.html
          rm "builds/web/${BASE}.html"
          cp web/mobile_controls_overlay.js "builds/web/${DOM_JS}"
          python3 - "builds/web/index.html" "$DOM_JS" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          js = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          marker = '</body>'
          inject = f'\n\t\t<script src="{js}"></script>\n\t'
          if marker not in text:
              raise SystemExit('missing </body> in exported HTML')
          path.write_text(text.replace(marker, inject + marker, 1), encoding='utf-8')
          PY
          test -s builds/web/index.html
          test -s "builds/web/${BASE}.wasm"
          test -s "builds/web/${BASE}.pck"
          test -s "builds/web/${DOM_JS}"
          grep -q "${DOM_JS}" builds/web/index.html
          grep -q "const GODOT_THREADS_ENABLED = false" builds/web/index.html
          grep -q "WEB LIVE V6" "builds/web/${DOM_JS}"
          grep -q "__lastMagazineControlCallback" "builds/web/${DOM_JS}"
          touch builds/web/.nojekyll
          printf '%s\n' 'LAST MAGAZINE web playtest' > builds/web/BUILD_INFO.txt
          printf 'commit=%s\n' "$GITHUB_SHA" >> builds/web/BUILD_INFO.txt
          printf 'asset_base=%s\n' "$BASE" >> builds/web/BUILD_INFO.txt
          printf 'dom_controls=%s\n' "$DOM_JS" >> builds/web/BUILD_INFO.txt
          printf 'runtime_smoke=player+weapon+hud+enemy-wave\n' >> builds/web/BUILD_INFO.txt

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAST-MAGAZINE-Web-Playtest
          path: builds/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
