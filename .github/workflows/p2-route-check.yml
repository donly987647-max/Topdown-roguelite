name: P2 Route Validation

on:
  push:
    branches: [agent/p2-core-loop]
  pull_request:
    branches: [godot-main]
  workflow_dispatch:

jobs:
  route-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project and reject script errors
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee godot-route-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-route-import.log; then
            exit 1
          fi

      - name: Run eight-room route tests
        run: timeout --signal=TERM 30s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/p2_route_test_runner.gd
