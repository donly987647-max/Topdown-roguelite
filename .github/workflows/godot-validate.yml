name: Validate Godot project

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-validate.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          mv godot-bin/Godot_v4.7.1-stable_linux.x86_64 godot-bin/godot
          chmod +x godot-bin/godot

      - name: Import project and validate scripts
        run: godot-bin/godot --headless --path godot --editor --quit --verbose

      - name: Boot main scene
        run: godot-bin/godot --headless --path godot --quit-after 180 --verbose
