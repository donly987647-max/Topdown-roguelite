plugins {
    id "com.android.application"
}

android {
    namespace "com.lastmagazine.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.lastmagazine.game"
        minSdk 24
        targetSdk 35
        versionCode 10402
        versionName "1.0.4-original.2"
        multiDexEnabled false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}
